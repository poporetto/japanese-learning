<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>結衣 — Japanese companion</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div id="sprite" class="sprite">
        <img id="sprite-img" alt="">
        <span class="sprite-placeholder"></span>
      </div>
      <div class="ident">
        <div class="name" id="who">結衣 Yui</div>
        <div class="stage" id="stage">知り合い</div>
        <div class="meter" id="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100">
          <div class="fill" id="meter-fill"></div>
        </div>
      </div>
      <div class="tools">
        <span class="emo" id="sprite-label"></span>
        <button id="debug" title="Inspect state">ⓘ</button>
        <button id="reset" title="Reset memory">↺</button>
      </div>
    </header>

    <section class="log" id="log" aria-live="polite"></section>

    <div class="suggestions" id="suggestions"></div>

    <form class="composer" id="form" autocomplete="off">
      <input id="input" placeholder="日本語で書いてみて…" aria-label="Message">
      <button type="submit" aria-label="Send">送信</button>
    </form>
    <p class="hint">Tap a message to reveal the English. ⧉ copies the plain Japanese.</p>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
